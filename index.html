<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GXION</title>
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS Khusus Login: Ultra Neon Glow, Glassmorphism, & Cyberpunk Vibe */
        :root {
            --accent-script: #0ea5e9;
            --glow-script: rgba(14, 165, 233, 0.6);
            --bg-dark: #030712;
            --border-color: rgba(255, 255, 255, 0.12);
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .auth-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, var(--bg-dark) 75%);
            position: relative;
            overflow: hidden;
        }

        /* Background Animated Ambient Glow Orbs */
        .auth-container::before, .auth-container::after {
            content: '';
            position: absolute;
            filter: blur(120px);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
        }
        .auth-container::before {
            width: 350px;
            height: 350px;
            background: rgba(14, 165, 233, 0.25);
            top: 15%;
            left: 20%;
            animation: float-slow 8s ease-in-out infinite alternate;
        }
        .auth-container::after {
            width: 400px;
            height: 400px;
            background: rgba(168, 85, 247, 0.2);
            bottom: 10%;
            right: 20%;
            animation: float-slow 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes float-slow {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        .auth-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 45px 35px;
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-align: center;
            z-index: 2;
            position: relative;
            animation: card-appear 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        @keyframes card-appear {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-logo {
            font-size: 52px;
            color: var(--accent-script);
            margin-bottom: 5px;
            text-shadow: 0 0 25px var(--glow-script);
            display: inline-flex;
            background: rgba(14, 165, 233, 0.1);
            padding: 16px;
            border-radius: 22px;
            border: 1px solid rgba(14, 165, 233, 0.3);
            box-shadow: inset 0 0 15px rgba(14, 165, 233, 0.2);
        }

        .auth-card h1 {
            font-size: 26px;
            margin: 10px 0 6px 0;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .auth-card p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 13.5px;
            line-height: 1.4;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            top: 50%;
            left: 18px;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 20px;
            transition: color 0.3s ease;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-group input:hover {
            border-color: rgba(255, 255, 255, 0.25);
        }

        .input-group input:focus {
            border-color: var(--accent-script);
            background: rgba(14, 165, 233, 0.08);
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.3), inset 0 0 5px rgba(14, 165, 233, 0.2);
        }

        .input-group input:focus + i {
            color: var(--accent-script);
            text-shadow: 0 0 10px var(--glow-script);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.5);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .btn-primary:hover::after {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -5px rgba(14, 165, 233, 0.7);
            background: linear-gradient(135deg, #38bdf8, #1d4ed8);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        /* Dev badge tipis di bawah card biar makin estetik */
        .card-footer-dev {
            margin-top: 25px;
            font-size: 12px;
            color: rgba(148, 163, 184, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .card-footer-dev strong {
            color: var(--accent-script);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="brand-logo">
                <i class='bx bx-cube-alt'></i>
            </div>
            <h1>AUTHENTICATE LOGIN</h1>
            <p>Login bebas password dan username, silahkan login sekarang untuk memulai ke halaman verifikasi lalu dashboard.</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Masukkan Username..." required autocomplete="off">
                    <i class='bx bx-user'></i>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Masukkan Password..." required>
                    <i class='bx bx-lock-alt'></i>
                </div>
                <button type="submit" class="btn-primary">LOG IN <i class='bx bx-right-arrow-alt' style="vertical-align: middle; margin-left: 5px;"></i></button>
            </form>

            <div class="card-footer-dev">
                <i class='bx bx-code-alt'></i> Secured by <strong>@Bawzhhh</strong>
            </div>
        </div>
    </div>
    
    <script>
        // Tangkap event submit form login agar langsung diarahkan ke halaman verifikasi
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah reload halaman default

            // Di sini lo bisa tambahin validasi username/password jika diperlukan, 
            // tapi karena langsung diarahkan, kita lempar langsung ke verify.html
            
            const btn = document.querySelector('.btn-primary');
            btn.innerHTML = "Memproses login...";
            btn.style.opacity = "0.7";

            setTimeout(() => {
                window.location.href = "verify.html"; // Lempar ke file verifikasi captcha & loading
            }, 600);
        });
    </script>
</body>
</html>
